# /etc/nginx/sites-available/us2us.conf
#
# TLS terminates here; the relay listens on 127.0.0.1:3000 only. One
# certificate covers all three names (see relay/README.md):
#   certbot certonly --webroot -w /var/www/letsencrypt \
#     -d us2us.app -d www.us2us.app -d relay.us2us.app
#
# Privacy: no access logs anywhere, and every server block keeps its error
# log at "crit". At the default level ("error") nginx logs each failed
# upstream connection, timeout or oversized body together with the client
# address and the request line, which names recipient accounts, PoW targets
# and media ids; such failures happen on every relay restart. Keep it at
# crit or above (the privacy policy describes what is left). The relay gets
# the client address in X-Forwarded-For (overwritten, never appended) for
# rate limiting only, and never logs it.

upstream us2us_relay {
    server 127.0.0.1:3000;
    keepalive 32;
    # Shorter than Node's 5 s keep-alive, so nginx never reuses a socket Node is closing.
    keepalive_timeout 4s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Concurrent media transfers per client address (each HTTP/2 stream counts).
limit_conn_zone $binary_remote_addr zone=us2us_media:10m;

# Plain HTTP: ACME challenges and a redirect, nothing else.
server {
    listen 80;
    listen [::]:80;
    server_name us2us.app www.us2us.app relay.us2us.app;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# relay.us2us.app: the API (PROTOCOL.md §4) and nothing else.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay.us2us.app;

    ssl_certificate     /etc/letsencrypt/live/us2us.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/us2us.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # No TLS session resumption at all: a resumed session would link a
    # sender-hiding request (sealed send, message PoW, media) to the
    # account whose connection created the session (PROTOCOL.md §1, §4.6),
    # whatever the client does.
    ssl_session_cache off;
    ssl_session_tickets off;

    access_log off;
    error_log /var/log/nginx/error.log crit;
    add_header Strict-Transport-Security "max-age=63072000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # JSON bodies (a registration with 100 Kyber keys is about 250 KB, an
    # ephemeral batch at most 1 MiB) and sealed envelopes (64 KiB); the relay
    # enforces the exact limits. They stay in memory, never in nginx's temp
    # directory.
    client_max_body_size 1m;
    client_body_buffer_size 1m;

    # Responses stream through nginx's memory buffers, so a client that reads
    # slowly holds back the relay (which drops a stalled response after 30 s)
    # instead of making nginx spool a whole blob or mailbox page to disk.
    proxy_max_temp_file_size 0;
    send_timeout 30s;
    limit_conn_status 429;

    location = /v1/ws {
        proxy_pass http://us2us_relay;
        # A proxy_set_header here replaces all of the server-level ones, so
        # they are repeated: without X-Forwarded-For every WebSocket client
        # would share 127.0.0.1's rate-limit bucket.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Clients ping about every 30 s; the relay drops sockets idle for 90 s.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Media upload. Keep client_max_body_size equal to MEDIA_MAX_BYTES. The
    # body is streamed to the relay, which checks the token, Content-Length,
    # the quotas and the free disk space before it accepts a single byte, so
    # nothing is written anywhere for a request that will be refused.
    location = /v1/media {
        client_max_body_size 64m;
        client_body_timeout 60s;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        limit_conn us2us_media 8;
        proxy_pass http://us2us_relay;
    }

    # Media download and delete.
    location ^~ /v1/media/ {
        limit_conn us2us_media 8;
        proxy_pass http://us2us_relay;
    }

    location /v1/ {
        proxy_pass http://us2us_relay;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.us2us.app;

    ssl_certificate     /etc/letsencrypt/live/us2us.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/us2us.app/privkey.pem;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    return 301 https://us2us.app$request_uri;
}

# us2us.app: the website. The API is not served under this name. The relay
# serves the prerendered pages and one static 404 page; it renders nothing
# per request.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name us2us.app;

    ssl_certificate     /etc/letsencrypt/live/us2us.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/us2us.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:us2us:10m;
    ssl_session_tickets off;

    access_log off;
    error_log /var/log/nginx/error.log crit;
    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 16k;

    location /v1/ {
        return 404;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_max_temp_file_size 0;
        proxy_pass http://us2us_relay;
    }
}
